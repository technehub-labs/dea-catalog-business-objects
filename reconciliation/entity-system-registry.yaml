# Entity System Registry (CR-BO-04; per the Conformance Standard CS-011)
# Per-repo lightweight slice of the General Entity System. Data-driven
# configuration for the entity-system gate. This repo has 0 entity
# records at the time of CR landing; the registry is declared generically
# (no profiles) so the gate is vacuously CONFORMANT (per the Stage 5
# staging).

# ES-002: Entity Contract (the common envelope + type-specific profiles)
envelope:
  file_globs:
    - "entities/**/*.yaml"
  type_field: type
  # CR-BO-05 registers the BusinessObject envelope profile ahead of the
  # first admission (per the CR-ACT-07 precedent; ES-002 fires on any
  # non-empty `type:` while `profiles: {}`).
  profiles:
    BusinessObject:
      required_fields:
        - id
        - type
        - name
        - version
        - object_class
        - ecf_domain
        - ecf_stage
        - description
        - lifecycle_status
        - provenance

# ES-001: Identity
# Pre-migration namespace (canonical = legacy). The repo's id family
# is the `dea:` prefix with a type-specific segment.
identity:
  id_field: id
  # Canonical = the org-wide form this repo's own IDM gate enforces
  # (check_id_system.py IDM-001); the pre-migration `dea:` family is
  # legacy (CR-BO-05 aligned the two gates; they previously disagreed).
  canonical_prefix: "objects:"
  canonical_pattern: "^objects:object-[a-z0-9-]+-[a-z2-9]{6}$"
  legacy_prefix: "dea:"
  legacy_pattern: "^dea:object-[a-z0-9-]+$"
  legacy_migration_map: "reconciliation/migration-id-map.yaml"

# ES-003: Relationship (CR-BO-05 enrichment: intra-catalog BO-to-BO
# semantics + the owner reference into the actors catalog)
relationships:
  field: relationships
  canonical_types:
    - places          # Customer places Order
    - includes        # Order includes Product
    - generates       # Order generates Invoice
    - settled-by      # Invoice settled-by Payment
    - governs         # Contract governs Order
    - toggles         # Feature Flag toggles Product
  forbidden_types:
    - part-of
  type_constraints:
    places:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
    includes:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
    generates:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
    settled-by:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
    governs:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
    toggles:
      source_types: [BusinessObject]
      target_identity_scopes: [dea-catalog-business-objects]
  cross_catalog_field: identity_scope

# ES-004: Lifecycle (empty; no entity records have a lifecycle state)
lifecycle:
  field: lifecycle
  status_field: status
  valid_states: []
  terminal_states: []
  transition_table: {}
  provenance_field: provenance.change_history
  provenance_required_keys:
    - cr
    - date
    - change

# ES-005: Per-type gate delegation (empty; no entity types registered)
per_type_gates: []

# CS-008 / CS-009: Exception mechanism (the EGV-011 escape hatch)
exceptions:
  registry_path: reconciliation/normalization.yaml
  verdict_key: verdict
  verdict_value: review-retained
  cr_key: cr
  expiry_key: expiry
  reviewer_key: reviewed_by
  excepted_rules_key: excepted_rules
