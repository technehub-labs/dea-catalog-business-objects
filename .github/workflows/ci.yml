name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-business-object-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 2 population has begun (CR-BO-05): the empty-tree early-exit
      # is dropped and schema validation runs on every entry.
      - name: Validate catalog entries against BusinessObject schema
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json
