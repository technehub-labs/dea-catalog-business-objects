name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-business-object-entries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validate YAML + JSON catalog entries against entity.schema.json.
      # Replaces the previously-pinned ajvdotpy/ajv-py-action@v1 — that
      # action repository does not exist on GitHub, so the workflow was
      # failing on action-resolution rather than validation. The fix uses
      # the verified dsanders11/json-schema-validate-action (88 commits,
      # MIT, maintained, used by Super-Linter).
      - name: Validate catalog entries against BusinessObject schema
        uses: dsanders11/json-schema-validate-action@v2.1.0
        with:
          schema: schemas/entity.schema.json
          files: |
            entities/**/*.yaml
            entities/**/*.json
