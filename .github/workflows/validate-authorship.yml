name: validate-authorship

# CR-BP-118b / CR-BP-118: Authorship Cardinal Rule (R1, R2) gate.
# Per-repo slice of the org-wide authorship cardinal rule. The
# dea-catalog-business-objects repo shares the 118a field shape
# (**Owner**, **Author**) and does not declare per-repo field
# extensions; the registry at reconciliation/authorship-fields.yaml
# enumerates the same fields as the 118a baseline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  authorship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Run Authorship Cardinal Rule gate (CR-BP-118; AUT-001..003)
        run: |
          python3 scripts/check_authorship.py --strict

      - name: Run authorship gate unit tests
        if: always()
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/test_check_authorship.py -q
